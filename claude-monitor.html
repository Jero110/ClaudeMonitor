<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0a;
    --bg1:      #111111;
    --bg2:      #161616;
    --bg3:      #1a1a1a;
    --border:   #1a1a1a;
    --border2:  #222222;
    --border3:  #2a2a2a;
    --text:     #f0f0f0;
    --text2:    #aaaaaa;
    --text3:    #777777;
    --text4:    #555555;
    --white:    #f0f0f0;
    --red:      #e05555;
    --green:    #5a9e6f;
    --amber:    #b8882a;
    --blue:     #4a7fa8;
    --emerald:  #3d8a6e;

    --font-mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --font-ui:   'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 13px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 12px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border3); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ─── LAYOUT ─────────────────────────────────────────────────── */

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ─── TAB BAR ────────────────────────────────────────────────── */

  .tab-bar {
    display: flex;
    align-items: stretch;
    height: 44px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
    overflow-x: auto;
    overflow-y: hidden;
  }

  .tab-bar::-webkit-scrollbar { height: 2px; }

  .tab-logo {
    display: flex;
    align-items: center;
    padding: 0 20px 0 16px;
    gap: 8px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
  }

  .logo-text {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text);
    text-transform: lowercase;
    white-space: nowrap;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text3);
    flex-shrink: 0;
    transition: background 150ms ease;
  }

  .status-dot.connected {
    background: var(--green);
    animation: live-pulse 2.5s ease-in-out infinite;
  }

  .status-dot.error { background: var(--red); }

  @keyframes live-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .tab-list {
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .tab-list::-webkit-scrollbar { height: 0; }

  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    cursor: pointer;
    white-space: nowrap;
    transition: color 120ms, border-color 120ms;
    flex-shrink: 0;
    position: relative;
  }

  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

  .tab-btn .tab-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text4);
    flex-shrink: 0;
  }

  .tab-btn .tab-dot.active-proc {
    background: var(--green);
    animation: live-pulse 2.5s ease-in-out infinite;
  }

  .tab-btn .tab-kbd {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text4);
    border: 1px solid var(--border2);
    border-radius: 2px;
    padding: 0px 3px;
    line-height: 1.6;
  }

  .tab-bar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
  }

  .meta-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.04em;
  }

  .meta-value {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 0.04em;
  }

  .meta-value.flash {
    color: var(--white);
    transition: color 150ms ease;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 150ms ease;
    border: 1px solid transparent;
    font-family: var(--font-ui);
  }

  .btn-ghost {
    background: transparent;
    border-color: var(--border3);
    color: var(--text2);
  }

  .btn-ghost:hover {
    border-color: var(--border3);
    color: var(--text);
    background: var(--bg2);
  }

  .btn-danger {
    background: rgba(224,85,85,0.1);
    border-color: rgba(224,85,85,0.25);
    color: var(--red);
  }

  .btn-danger:hover {
    background: rgba(224,85,85,0.2);
    border-color: rgba(224,85,85,0.4);
  }

  /* ─── TAB CONTENT ────────────────────────────────────────────── */

  .tab-content {
    flex: 1;
    overflow: hidden;
    display: none;
    flex-direction: column;
    min-height: 0;
  }

  .tab-content.active { display: flex; }

  /* ─── OVERVIEW TAB ───────────────────────────────────────────── */

  .overview-header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .overview-stat {
    display: flex;
    align-items: baseline;
    gap: 5px;
  }

  .overview-stat-num {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  .overview-stat-label {
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .overview-sep {
    width: 1px;
    height: 20px;
    background: var(--border2);
  }

  .overview-ts {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    margin-left: auto;
  }

  .overview-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    align-content: start;
  }

  .session-card {
    border: 1px solid var(--border2);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg1);
    cursor: pointer;
    transition: border-color 150ms ease, background 150ms ease;
  }

  .session-card:hover {
    border-color: var(--border3);
    background: var(--bg2);
  }

  .session-card.has-active { border-color: rgba(90,158,111,0.25); }
  .session-card.has-active:hover { border-color: rgba(90,158,111,0.45); }

  .sc-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
  }

  .sc-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text4);
  }

  .sc-dot.active { background: var(--green); animation: live-pulse 2.5s ease-in-out infinite; }
  .sc-dot.waiting { background: var(--amber); animation: live-pulse 2s ease-in-out infinite; }
  .sc-dot.idle { background: var(--text4); }

  .sc-name {
    font-weight: 600;
    font-size: 12px;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .model-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: lowercase;
    border: 1px solid transparent;
    flex-shrink: 0;
  }

  .model-pill.haiku  { background: rgba(61,138,110,0.1);  color: #5aaa88; border-color: rgba(61,138,110,0.2); }
  .model-pill.sonnet { background: rgba(74,127,168,0.1);  color: #6a9fc0; border-color: rgba(74,127,168,0.2); }
  .model-pill.opus   { background: rgba(184,136,42,0.1);  color: #c8a050; border-color: rgba(184,136,42,0.2); }
  .model-pill.unknown { background: rgba(100,100,100,0.08); color: var(--text3); border-color: var(--border2); }

  .sc-body {
    padding: 8px 12px 10px;
  }

  .sc-ctx-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .sc-ctx-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text3);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ctx-bar-wrap {
    flex: 1;
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .ctx-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .ctx-bar-fill.low  { background: var(--blue); }
  .ctx-bar-fill.med  { background: var(--amber); }
  .ctx-bar-fill.high { background: var(--red); }

  .sc-cost {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text2);
    flex-shrink: 0;
  }

  .sc-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text3);
  }

  .sc-cwd {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sc-agents-badge {
    flex-shrink: 0;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(74,127,168,0.08);
    border: 1px solid rgba(74,127,168,0.15);
    color: #6a9fc0;
    font-size: 9px;
    font-family: var(--font-mono);
  }

  /* ─── SESSION TAB ────────────────────────────────────────────── */

  .session-tab-inner {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    /* let content define its own height, tab scrolls */
  }

  /* Section cards */
  .sec-card {
    border: 1px solid var(--border2);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg1);
    flex-shrink: 0;
  }

  .sec-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }

  .sec-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .sec-body {
    padding: 12px 14px;
  }

  /* Process info grid */
  .proc-grid {
    display: grid;
    grid-template-columns: 80px 1fr 80px 1fr;
    gap: 6px 14px;
  }

  .proc-key {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text3);
    display: flex;
    align-items: center;
  }

  .proc-val {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    word-break: break-all;
    display: flex;
    align-items: center;
  }

  .proc-val.copyable {
    cursor: pointer;
    user-select: all;
  }

  .proc-val.copyable:hover { color: var(--text); }

  /* Context & cost */
  .ctx-big-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .ctx-big-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
  }

  .ctx-big-bar-wrap {
    flex: 1;
    height: 5px;
    background: var(--bg3);
    border-radius: 3px;
    overflow: hidden;
  }

  .ctx-big-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .ctx-pct {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  .status-activity {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
  }

  .activity-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text4);
  }

  .activity-dot.active  { background: var(--blue);  animation: live-pulse 1.2s ease-in-out infinite; }
  .activity-dot.waiting { background: var(--amber); animation: live-pulse 2s ease-in-out infinite; }
  .activity-dot.dissolved { background: var(--green); }

  /* Kill button in session tab */
  .kill-session-btn {
    background: none;
    border: 1px solid rgba(224,85,85,0.25);
    border-radius: 4px;
    color: var(--red);
    padding: 3px 10px;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: all 150ms ease;
  }

  .kill-session-btn:hover { background: rgba(224,85,85,0.1); border-color: rgba(224,85,85,0.4); }

  /* Sub-tabs (agents / messages inside session tab) */
  .sub-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sub-tab-btn {
    padding: 8px 14px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text3);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 120ms, border-color 120ms;
    margin-bottom: -1px;
  }

  .sub-tab-btn:hover { color: var(--text2); }
  .sub-tab-btn.active { color: var(--text); border-bottom-color: var(--text); }

  .sub-tab-content { display: none; }
  .sub-tab-content.active { display: block; }

  /* Agent list in session tab */
  .agent-list-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 150ms ease;
  }

  .agent-list-item:last-child { border-bottom: none; }
  .agent-list-item:hover { background: var(--bg2); }

  .agent-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .agent-status-badge.running   { background: rgba(90,158,111,0.1);  color: #5aaa88; border: 1px solid rgba(90,158,111,0.2); }
  .agent-status-badge.completed { background: rgba(100,100,100,0.08); color: var(--text3); border: 1px solid var(--border2); }
  .agent-status-badge.unknown   { background: rgba(100,100,100,0.08); color: var(--text3); border: 1px solid var(--border2); }

  .agent-list-info { flex: 1; min-width: 0; }

  .agent-list-id {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text2);
    margin-bottom: 2px;
  }

  .agent-list-last {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }

  .agent-list-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text4);
    display: flex;
    gap: 10px;
  }

  /* Expanded agent conv */
  .agent-conv-area {
    background: var(--bg);
    border-top: 1px solid var(--border);
    max-height: 260px;
    overflow-y: auto;
  }

  /* Messages */
  .msg-list { }

  .msg-row {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
  }

  .msg-row:last-child { border-bottom: none; }

  .msg-role {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .msg-role.assistant { color: var(--blue); }
  .msg-role.user      { color: var(--text3); }

  .msg-content {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text2);
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-ts {
    font-size: 9px;
    color: var(--text4);
    font-family: var(--font-mono);
    margin-top: 3px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: var(--text3);
    font-size: 11px;
    gap: 6px;
    font-family: var(--font-mono);
  }

  .empty-icon {
    font-size: 20px;
    opacity: 0.3;
    margin-bottom: 4px;
  }

  /* Overview empty */
  .overview-empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 8px;
    color: var(--text3);
    font-family: var(--font-mono);
    font-size: 11px;
  }

  /* ─── LOG STRIP ──────────────────────────────────────────────── */

  .log-strip {
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }

  .log-strip-header {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 30px;
    cursor: pointer;
    user-select: none;
    gap: 10px;
  }

  .log-strip-header:hover { background: var(--bg1); }

  .log-chevron {
    font-size: 9px;
    color: var(--text3);
    transition: transform 150ms ease;
  }

  .log-chevron.open { transform: rotate(180deg); }

  .log-strip-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }

  .log-strip-preview {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .log-full {
    display: none;
    max-height: 140px;
    overflow-y: auto;
    padding: 0 16px 8px;
  }

  .log-full.open { display: block; }

  .log-entry {
    display: flex;
    gap: 10px;
    padding: 2px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.6;
  }

  .log-entry:last-child { border-bottom: none; }

  .log-time { color: var(--text3); flex-shrink: 0; min-width: 56px; }
  .log-msg  { color: var(--text2); }

  /* ─── KILL MODAL ─────────────────────────────────────────────── */

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg1);
    border: 1px solid var(--border3);
    border-radius: 6px;
    padding: 20px 24px;
    width: 320px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.6);
  }

  .modal-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

  .modal-pid {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .modal-warn {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ─── OVERVIEW SPLIT ─────────────────────────────────────────── */
  .overview-body {
    flex: 1;
    overflow: hidden;
    display: flex;
    gap: 0;
  }

  .overview-cards-col {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
    align-content: start;
  }

  .overview-tree-col {
    width: 240px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }

  .tree-section-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text4);
    padding: 0 14px 6px;
  }

  .tree-proc-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    cursor: pointer;
    transition: background 120ms;
  }

  .tree-proc-row:hover { background: var(--bg2); }

  .tree-proc-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--green);
    animation: live-pulse 2.5s ease-in-out infinite;
  }

  .tree-proc-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tree-proc-model {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text4);
  }

  .tree-child-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px 4px 26px;
    cursor: pointer;
    transition: background 120ms;
  }

  .tree-child-row:hover { background: var(--bg2); }

  .tree-connector {
    font-size: 10px;
    color: var(--border3);
    flex-shrink: 0;
    font-family: var(--font-mono);
  }

  .tree-child-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tree-child-dot.running  { background: var(--green); animation: live-pulse 2s ease-in-out infinite; }
  .tree-child-dot.completed { background: var(--text4); }
  .tree-child-dot.team     { background: var(--amber); }

  .tree-child-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tree-child-label:hover { color: var(--text2); }

  .tree-child-badge {
    font-size: 8px;
    font-family: var(--font-mono);
    color: var(--text4);
    flex-shrink: 0;
  }

  .tree-sep { height: 1px; background: var(--border); margin: 8px 14px; }

  /* ─── AGENT DETAIL PANEL (in overview tree click) ────────────── */
  .agent-detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,0.5);
    align-items: flex-start;
    justify-content: flex-end;
  }
  .agent-detail-overlay.open { display: flex; }
  .agent-detail-panel {
    width: 400px;
    height: 100vh;
    background: var(--bg1);
    border-left: 1px solid var(--border3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .agent-detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .agent-detail-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
    flex: 1;
  }
  .agent-detail-close {
    background: none; border: none; color: var(--text3);
    font-size: 16px; cursor: pointer; padding: 0 2px; line-height: 1;
    transition: color 120ms;
  }
  .agent-detail-close:hover { color: var(--text); }
  .agent-detail-body { flex: 1; overflow-y: auto; }

  /* ─── MISC ───────────────────────────────────────────────────── */
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .no-select { user-select: none; }

  /* coloring helpers for ctx bars */
  .ctx-low  { color: var(--blue); }
  .ctx-med  { color: var(--amber); }
  .ctx-high { color: var(--red); }

  /* Teams section */
  .team-card {
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .team-card:last-child { margin-bottom: 0; }

  .team-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }

  .team-card-name { font-weight: 600; font-size: 11px; color: var(--text); flex: 1; }
  .team-card-desc { font-size: 9px; color: var(--text3); font-family: var(--font-mono); }

  .team-delete-btn {
    background: none;
    border: none;
    color: var(--text3);
    font-size: 14px;
    cursor: pointer;
    opacity: 0.4;
    padding: 0 2px;
    transition: opacity 0.15s, color 0.15s;
    line-height: 1;
  }

  .team-delete-btn:hover { opacity: 1; color: var(--red); }

  .member-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .member-row:last-child { border-bottom: none; }

  .member-color-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .member-color-dot.blue   { background: #4a7fa8; }
  .member-color-dot.green  { background: #5a9e6f; }
  .member-color-dot.red    { background: #e05555; }
  .member-color-dot.yellow { background: #b8882a; }
  .member-color-dot.purple { background: #8a6ec0; }
  .member-color-dot.lead   { background: var(--text3); }

  .member-info { flex: 1; min-width: 0; }

  .member-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
  }

  .member-name { font-size: 11px; font-weight: 600; color: var(--text); }

  .member-role-badge {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(100,100,100,0.08);
    color: var(--text3);
    border: 1px solid var(--border2);
  }

  .member-role-badge.lead { background: rgba(184,136,42,0.1); color: #c8a050; border-color: rgba(184,136,42,0.2); }

  .member-model {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text4);
    margin-left: auto;
  }

  .member-activity {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 3px;
    min-height: 14px;
  }

  .activity-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
  }

  .activity-badge.active   { color: var(--text2); }
  .activity-badge.waiting  { color: var(--amber); }
  .activity-badge.dissolved { color: var(--green); }

  .member-tasks {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 3px;
  }

  .member-task-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 9px;
    border: 1px solid var(--border2);
    background: var(--bg1);
    color: var(--text2);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .member-task-pill.completed  { color: var(--text4); background: transparent; }
  .member-task-pill.in_progress { border-color: rgba(74,127,168,0.3); color: #6a9fc0; background: rgba(74,127,168,0.06); }

  .task-status-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text4);
  }

  .task-status-dot.in_progress { background: #4a7fa8; animation: live-pulse 1.4s ease-in-out infinite; }
  .task-status-dot.completed   { background: var(--green); }

  .team-tasks-section {
    padding: 6px 12px 8px;
    background: var(--bg1);
    border-top: 1px solid var(--border);
  }

  .team-tasks-title {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 5px;
  }

  .team-task-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
  }

  .team-task-row:last-child { border-bottom: none; }

  .team-task-id     { font-family: var(--font-mono); font-size: 9px; color: var(--text4); flex-shrink: 0; width: 16px; }
  .team-task-subject { flex: 1; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team-task-owner  { font-family: var(--font-mono); font-size: 9px; color: var(--text3); flex-shrink: 0; }

  .team-task-status             { font-size: 9px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
  .team-task-status.completed   { color: var(--green); }
  .team-task-status.in_progress { color: #4a7fa8; }
  .team-task-status.todo        { color: var(--text3); }

  /* Generic delete (×) button reused across cards */
  .item-delete-btn {
    background: none;
    border: none;
    color: var(--text4);
    font-size: 13px;
    cursor: pointer;
    opacity: 0;
    padding: 0 3px;
    line-height: 1;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  *:hover > .item-delete-btn,
  .agent-list-item:hover .item-delete-btn,
  .sc-header:hover .item-delete-btn,
  .tree-proc-row:hover .item-delete-btn,
  .tree-child-row:hover .item-delete-btn {
    opacity: 1;
  }
  .item-delete-btn:hover { color: var(--red); }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- TAB BAR -->
  <div class="tab-bar" id="tab-bar">
    <div class="tab-logo">
      <div class="status-dot" id="status-dot"></div>
      <span class="logo-text">claude monitor</span>
    </div>
    <div class="tab-list" id="tab-list">
      <button class="tab-btn active" id="main-tab-overview" onclick="switchMainTab('overview')" title="Press Escape">
        <span class="tab-kbd">~</span> Overview
      </button>
      <!-- session tabs injected here -->
    </div>
    <div class="tab-bar-right">
      <span class="meta-label">cost</span>
      <span class="meta-value" id="header-cost">—</span>
      <span class="meta-label">at</span>
      <span class="meta-value" id="timestamp-display">—</span>
      <button class="btn btn-ghost" id="refresh-btn" onclick="manualRefresh()" style="padding:4px 10px;font-size:10px;">
        <span id="refresh-icon">↻</span> Refresh
      </button>
    </div>
  </div>

  <!-- OVERVIEW TAB -->
  <div class="tab-content active" id="tab-content-overview">
    <div class="overview-header">
      <div class="overview-stat">
        <span class="overview-stat-num" id="ov-procs">0</span>
        <span class="overview-stat-label">processes</span>
      </div>
      <div class="overview-sep"></div>
      <div class="overview-stat">
        <span class="overview-stat-num" id="ov-agents">0</span>
        <span class="overview-stat-label">agents</span>
      </div>
      <div class="overview-sep"></div>
      <div class="overview-stat">
        <span class="overview-stat-num" id="ov-cost">$0.00</span>
        <span class="overview-stat-label">total cost</span>
      </div>
      <span class="overview-ts" id="ov-ts">—</span>
    </div>
    <div class="overview-body">
      <div class="overview-cards-col" id="overview-cards">
        <div class="overview-empty"><div class="empty-icon">◦</div>no active sessions</div>
      </div>
      <div class="overview-tree-col" id="overview-tree"></div>
    </div>
  </div>

  <!-- Agent detail side panel -->
  <div class="agent-detail-overlay" id="agent-detail-overlay" onclick="closeAgentDetail(event)">
    <div class="agent-detail-panel">
      <div class="agent-detail-header">
        <span class="agent-detail-title" id="agent-detail-title">Agent</span>
        <button class="agent-detail-close" onclick="document.getElementById('agent-detail-overlay').classList.remove('open')">×</button>
      </div>
      <div class="agent-detail-body" id="agent-detail-body"></div>
    </div>
  </div>

  <!-- session tab contents are injected here by JS -->

  <!-- LOG STRIP -->
  <div class="log-strip">
    <div class="log-strip-header" id="log-toggle">
      <span class="log-chevron" id="log-chevron">▲</span>
      <span class="log-strip-label">Log</span>
      <span class="log-strip-preview" id="log-preview">Waiting for data…</span>
    </div>
    <div class="log-full" id="log-full"></div>
  </div>

</div>

<!-- KILL MODAL -->
<div class="modal-overlay" id="kill-modal">
  <div class="modal">
    <div class="modal-title">Kill process</div>
    <div class="modal-pid" id="modal-pid">—</div>
    <div class="modal-warn">This will send SIGTERM to the process. This action cannot be undone.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Kill</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────

const state = {
  data: null,
  lastFetch: null,
  killTarget: null,
  logs: [],
  logOpen: false,
  agentConvData: {},       // agentId -> messages[]
  agentConvLoading: new Set(),
  sessionConvData: {},     // sessionId -> messages[]
  activity: {},            // sessionId -> { status, activity }
  teams: [],
  sessions: [],            // from /sessions
  activeMainTab: 'overview',
  activeSubTabs: {},       // pid -> 'agents'|'messages'|'teams'
  expandedAgents: new Set(),
  sessionNames: {},
};

// ─── UTILS ────────────────────────────────────────────────────────────────────

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseModel(modelStr) {
  if (!modelStr) return 'unknown';
  const m = modelStr.toLowerCase();
  if (m.includes('haiku'))  return 'haiku';
  if (m.includes('sonnet')) return 'sonnet';
  if (m.includes('opus'))   return 'opus';
  const parts = modelStr.replace(/^claude-?/i, '').trim();
  return parts || modelStr || 'unknown';
}

function shortPath(p) {
  if (!p) return '—';
  return p.replace(/^\/Users\/[^/]+/, '~').replace(/^\/home\/[^/]+/, '~');
}

function shortId(id) {
  if (!id) return '—';
  return id.length > 20 ? id.slice(0, 8) + '…' + id.slice(-6) : id;
}

function fmtK(n) {
  if (!n) return '0';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return Math.round(n/1000) + 'k';
  return String(n);
}

function fmtTokens(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n || 0);
}

function nowStr() {
  return new Date().toLocaleTimeString('en-US', { hour12: false });
}

function addLog(msg) {
  state.logs.unshift({ time: nowStr(), msg });
  if (state.logs.length > 100) state.logs.pop();
  renderLog();
}

function ctxClass(pct) {
  if (pct >= 90) return 'high';
  if (pct >= 70) return 'med';
  return 'low';
}

// ─── FETCH /data ──────────────────────────────────────────────────────────────

async function fetchData() {
  const btn  = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  if (btn)  btn.disabled = true;
  if (icon) { icon.style.display = 'inline-block'; icon.style.animation = 'spin 0.6s linear infinite'; }
  try {
    const res = await fetch('http://localhost:7337/data', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    state.data = data;
    state.lastFetch = Date.now();
    state.sessionNames = data.sessionNames || {};
    document.getElementById('status-dot').className = 'status-dot connected';
    addLog(`Refreshed — ${(data.processes||[]).length} procs, ${(data.agents||[]).length} agents`);
    flashTimestamp(data.timestamp);
    render(data);
    fetchTeams();
    fetchSessions();
    // Refresh messages for active sessions silently in background
    (data.processes||[]).forEach(p => {
      if (p.sessionId) loadSessionConv(p.sessionId, true);
    });
  } catch (e) {
    document.getElementById('status-dot').className = 'status-dot error';
    addLog(`Error: ${e.message} — is claude-monitor.sh running?`);
  } finally {
    if (btn)  btn.disabled = false;
    if (icon) icon.style.animation = '';
  }
}

function manualRefresh() { fetchData(); }

function flashTimestamp(ts) {
  const el = document.getElementById('timestamp-display');
  const d = ts ? new Date(ts) : new Date();
  el.textContent = d.toLocaleTimeString('en-US', { hour12: false });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 600);
}

// ─── ACTIVITY ─────────────────────────────────────────────────────────────────

async function fetchAllActivity() {
  const procs = state.data?.processes || [];
  const procIds = procs.map(p => p.sessionId).filter(Boolean);
  const memberIds = state.teams.flatMap(t => t.members.map(m => m.sessionId)).filter(Boolean);
  const ids = [...new Set([...procIds, ...memberIds])];
  if (!ids.length) return;
  try {
    const res = await fetch(`http://localhost:7337/activity-bulk?ids=${ids.join(',')}`, { cache: 'no-store' });
    if (res.ok) {
      Object.assign(state.activity, await res.json());
      if (state.data) { renderSessionTabs(state.data); renderOverviewTree(state.data); }
    }
  } catch (_) {}
}

let _activityTimer = null;
function scheduleActivityPoll() {
  clearTimeout(_activityTimer);
  const hasActive = (state.data?.processes || []).some(p => p.sessionId) || state.teams.length > 0;
  const delay = hasActive ? 800 : 5000;
  _activityTimer = setTimeout(async () => { await fetchAllActivity(); scheduleActivityPoll(); }, delay);
}
scheduleActivityPoll();

// ─── TEAMS ────────────────────────────────────────────────────────────────────

async function fetchTeams() {
  try {
    const res = await fetch('http://localhost:7337/teams', { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      state.teams = d.teams || [];
      if (state.data) { renderSessionTabs(state.data); renderOverviewTree(state.data); }
    }
  } catch (_) {}
}

function renderTeamsSection(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!state.teams.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">◦</div>no teams</div>`;
    return;
  }
  const COLORS = ['blue','green','red','yellow','purple'];
  el.innerHTML = state.teams.map(team => {
    const membersHtml = team.members.map((m, mi) => {
      const colorClass = m.isLead ? 'lead' : (m.color || COLORS[mi % COLORS.length]);
      const act = (m.sessionId && state.activity[m.sessionId]) || m.activity || {};
      const actStatus = act.status || 'idle';
      const actLabel  = act.activity || '';
      const actHtml = actLabel
        ? `<span class="activity-badge ${actStatus}"><span class="activity-dot ${actStatus}"></span>${escHtml(actLabel)}</span>`
        : actStatus === 'waiting'
          ? `<span class="activity-badge waiting"><span class="activity-dot waiting"></span>Waiting…</span>`
          : '';
      const tasksHtml = (m.tasks || []).map(t => {
        const st = (t.status||'todo');
        return `<span class="member-task-pill ${st}" title="${escHtml(t.description||'')}"><span class="task-status-dot ${st}"></span>${escHtml(t.subject||('Task #'+t.id))}</span>`;
      }).join('');
      return `<div class="member-row">
        <span class="member-color-dot ${colorClass}"></span>
        <div class="member-info">
          <div class="member-top">
            <span class="member-name">${escHtml(m.name)}</span>
            <span class="member-role-badge ${m.isLead?'lead':''}">${m.isLead?'lead':escHtml(m.agentType||'agent')}</span>
            <span class="member-model">${parseModel(m.model||'')}</span>
          </div>
          ${actHtml ? `<div class="member-activity">${actHtml}</div>` : ''}
          ${tasksHtml ? `<div class="member-tasks">${tasksHtml}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    const allTasksHtml = (team.tasks||[]).length
      ? `<div class="team-tasks-section"><div class="team-tasks-title">Tasks (${team.tasks.length})</div>
          ${team.tasks.map(t => {
            const st = t.status||'todo';
            return `<div class="team-task-row">
              <span class="team-task-id">#${t.id}</span>
              <span class="team-task-subject">${escHtml(t.subject||'')}</span>
              <span class="team-task-owner">${escHtml(t.owner||'—')}</span>
              <span class="team-task-status ${st}">${st.replace('_',' ')}</span>
            </div>`;
          }).join('')}
        </div>` : '';
    return `<div class="team-card">
      <div class="team-card-header">
        <span class="team-card-name">${escHtml(team.name)}</span>
        <span class="team-card-desc">${escHtml(team.description||'')}</span>
        <button class="team-delete-btn" data-team="${escHtml(team.name)}" title="Delete team">×</button>
      </div>
      ${membersHtml}
      ${allTasksHtml}
    </div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.team-delete-btn');
  if (btn) { e.stopPropagation(); deleteTeam(btn.dataset.team); return; }
  const sdel = e.target.closest('.session-delete-btn');
  if (sdel) { e.stopPropagation(); deleteSession(sdel.dataset.sid); return; }
  const adel = e.target.closest('.agent-delete-btn');
  if (adel) { e.stopPropagation(); deleteAgent(adel.dataset.aid); return; }
});

async function deleteTeam(name) {
  state.teams = state.teams.filter(t => t.name !== name);
  if (state.data) renderSessionTabs(state.data);
  try {
    await fetch(`http://localhost:7337/team?name=${encodeURIComponent(name)}`, { method: 'DELETE' });
    addLog(`Deleted team "${name}"`);
  } catch (e) { addLog(`Delete team error: ${e.message}`); }
  fetchTeams();
}

async function deleteSession(sid) {
  // Optimistic remove from sessions list
  state.sessions = state.sessions.filter(s => s.id !== sid);
  if (state.data) renderOverview(state.data);
  try {
    await fetch(`http://localhost:7337/sessions/${encodeURIComponent(sid)}`, { method: 'DELETE' });
    addLog(`Deleted session ${sid.slice(0,8)}…`);
  } catch (e) { addLog(`Delete session error: ${e.message}`); }
  setTimeout(fetchData, 600);
}

async function deleteAgent(aid) {
  // Optimistic remove from agents list
  if (state.data) {
    state.data.agents = (state.data.agents||[]).filter(a => a.id !== aid);
    renderSessionTabs(state.data);
    renderOverviewTree(state.data);
  }
  try {
    await fetch(`http://localhost:7337/agent/${encodeURIComponent(aid)}`, { method: 'DELETE' });
    addLog(`Deleted agent ${aid.slice(0,8)}…`);
  } catch (e) { addLog(`Delete agent error: ${e.message}`); }
}

// ─── SESSIONS fetch ────────────────────────────────────────────────────────────

async function fetchSessions() {
  try {
    const res = await fetch('http://localhost:7337/sessions', { cache: 'no-store' });
    if (res.ok) {
      state.sessions = await res.json();
      if (state.data) { renderOverview(state.data); renderSessionTabs(state.data); }
    }
  } catch (_) {}
}

let _sessionsTimer = null;
function scheduleSessionsPoll() {
  clearTimeout(_sessionsTimer);
  _sessionsTimer = setTimeout(async () => { await fetchSessions(); scheduleSessionsPoll(); }, 10000);
}
fetchSessions().then(scheduleSessionsPoll);

// ─── CONV LOADING ─────────────────────────────────────────────────────────────

const _convLoading = new Set();
async function loadSessionConv(sessionId, force = false) {
  if (_convLoading.has(sessionId)) return;
  if (!force && state.sessionConvData[sessionId]) return;
  _convLoading.add(sessionId);
  try {
    const res = await fetch(`http://localhost:7337/session/${encodeURIComponent(sessionId)}`, { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      state.sessionConvData[sessionId] = d.messages || [];
      if (state.data) rerenderSessionTab(sessionId);
    }
  } catch (_) {} finally {
    _convLoading.delete(sessionId);
  }
}

async function loadAgentConv(agentId) {
  if (state.agentConvLoading.has(agentId)) return;
  state.agentConvLoading.add(agentId);
  try {
    const res = await fetch(`http://localhost:7337/agent/${encodeURIComponent(agentId)}`, { cache: 'no-store' });
    if (res.ok) {
      const d = await res.json();
      state.agentConvData[agentId] = d.messages || d.conversation || [];
    }
  } catch (_) {} finally {
    state.agentConvLoading.delete(agentId);
    if (state.data) {
      const p = (state.data.processes||[]).find(proc => (state.data.agents||[]).find(a => a.id === agentId && a.sessionId === proc.sessionId));
      if (p) rerenderSessionTab(p.sessionId);
    }
  }
}

function rerenderSessionTab(sessionId) {
  if (!state.data) return;
  const p = (state.data.processes||[]).find(pr => pr.sessionId === sessionId);
  if (!p) return;
  const containerId = `tab-content-session-${p.pid}`;
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = buildSessionTabContent(p, state.data.agents||[]);
}

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────

function render(data) {
  const procs  = [...(data.processes || [])].sort((a,b) => a.pid - b.pid);
  const agents = data.agents || [];

  renderOverview(data);
  renderOverviewTree(data);
  syncSessionTabs(procs, agents);
  renderSessionTabs(data);
  updateOverviewStats(data);
}

// ─── OVERVIEW TREE ────────────────────────────────────────────────────────────

function renderOverviewTree(data) {
  const procs  = [...(data.processes||[])].sort((a,b) => (a.first_seen||a.pid) - (b.first_seen||b.pid));
  const agents = data.agents || [];
  const el = document.getElementById('overview-tree');
  if (!el) return;

  if (!procs.length) { el.innerHTML = ''; return; }

  const agentsBySession = {};
  agents.forEach(a => {
    const sid = a.sessionId || '__none__';
    if (!agentsBySession[sid]) agentsBySession[sid] = [];
    agentsBySession[sid].push(a);
  });

  // Map teams to process by leadSessionId (the process that spawned the team)
  const teamsBySession = {};
  state.teams.forEach(t => {
    const leadSid = t.leadSessionId;
    if (leadSid) {
      if (!teamsBySession[leadSid]) teamsBySession[leadSid] = [];
      if (!teamsBySession[leadSid].find(x => x.name === t.name))
        teamsBySession[leadSid].push(t);
    }
  });

  let html = `<div class="tree-section-label">Tree</div>`;

  const renderedTeams = new Set();

  procs.forEach((p, pi) => {
    const label = p.sessionName || (p.sessionId ? p.sessionId.slice(0,8) : `pid-${p.pid}`);
    const model = parseModel(p.model);
    const myAgents = agentsBySession[p.sessionId] || [];
    // Match teams by leadSessionId OR by any member sessionId matching process sessionId
    const myTeams = state.teams.filter(t =>
      (t.leadSessionId && t.leadSessionId === p.sessionId) ||
      (p.sessionId && t.members?.some(m => m.sessionId === p.sessionId))
    );

    html += `<div class="tree-proc-row" onclick="switchMainTab('session-${p.pid}')">
      <span class="tree-proc-dot"></span>
      <span class="tree-proc-name">${escHtml(label)}</span>
      <span class="tree-proc-model">${model}</span>
      ${p.sessionId ? `<button class="item-delete-btn session-delete-btn" data-sid="${escHtml(p.sessionId)}" title="Remove session">×</button>` : ''}
    </div>`;

    // Teams
    myTeams.forEach(t => {
      renderedTeams.add(t.name);
      html += `<div class="tree-child-row" onclick="openTeamDetail(event,'${escHtml(p.pid)}','${escHtml(t.name)}')">
        <span class="tree-connector">└</span>
        <span class="tree-child-dot team"></span>
        <span class="tree-child-label" title="${escHtml(t.name)}">${escHtml(t.name)}</span>
        <button class="item-delete-btn team-delete-btn" data-team="${escHtml(t.name)}" title="Delete team">×</button>
      </div>`;
    });

    // Agents (deduplicated)
    const seen = new Set();
    myAgents.forEach(a => {
      if (seen.has(a.id)) return; seen.add(a.id);
      const st = (a.status||'completed').toLowerCase();
      const shortLabel = a.lastLine ? a.lastLine.slice(0,28) : shortId(a.id);
      html += `<div class="tree-child-row" onclick="openAgentDetail(event,'${escHtml(a.id)}')">
        <span class="tree-connector">└</span>
        <span class="tree-child-dot ${st}"></span>
        <span class="tree-child-label" title="${escHtml(a.lastLine||a.id)}">${escHtml(shortLabel)}</span>
        <span class="tree-child-badge">${st === 'running' ? '▶' : '○'}</span>
        <button class="item-delete-btn agent-delete-btn" data-aid="${escHtml(a.id)}" title="Remove agent">×</button>
      </div>`;
    });

    if (pi < procs.length - 1) html += `<div class="tree-sep"></div>`;
  });

  // Orphan teams (no matching process)
  const orphanTeams = state.teams.filter(t => !renderedTeams.has(t.name));
  if (orphanTeams.length) {
    if (procs.length) html += `<div class="tree-sep"></div>`;
    html += `<div class="tree-section-label">Teams</div>`;
    orphanTeams.forEach(t => {
      html += `<div class="tree-proc-row" style="cursor:default">
        <span class="tree-child-dot team" style="width:6px;height:6px"></span>
        <span class="tree-proc-name">${escHtml(t.name)}</span>
        <button class="item-delete-btn team-delete-btn" data-team="${escHtml(t.name)}" title="Delete team">×</button>
      </div>`;
      t.members?.forEach(m => {
        const act = (m.sessionId && state.activity[m.sessionId]) || m.activity || {};
        const dot = act.status === 'active' ? 'running' : act.status === 'waiting' ? 'team' : 'completed';
        html += `<div class="tree-child-row">
          <span class="tree-connector">└</span>
          <span class="tree-child-dot ${dot}"></span>
          <span class="tree-child-label">${escHtml(m.name)}</span>
          <span class="tree-child-badge" style="color:var(--text4)">${m.isLead?'lead':''}</span>
        </div>`;
      });
    });
  }

  el.innerHTML = html;
}

// ─── OVERVIEW ─────────────────────────────────────────────────────────────────

function renderOverview(data) {
  const procs  = [...(data.processes||[])].sort((a,b) => a.pid - b.pid);
  const agents = data.agents || [];
  const container = document.getElementById('overview-cards');

  if (!procs.length) {
    container.innerHTML = `<div class="overview-empty"><div class="empty-icon">◦</div>no active processes</div>`;
    return;
  }

  const agentsBySession = {};
  agents.forEach(a => {
    const sid = a.sessionId || '';
    if (!agentsBySession[sid]) agentsBySession[sid] = [];
    agentsBySession[sid].push(a);
  });

  container.innerHTML = procs.map(p => {
    const model       = parseModel(p.model);
    const act         = p.sessionId ? (state.activity[p.sessionId] || null) : null;
    const actStatus   = act?.status || 'idle';
    const sessionLabel = p.sessionName || (p.sessionId ? p.sessionId.slice(0,8)+'…' : 'PID '+p.pid);
    const cwd         = parseCwdFromCmd(p.cmd) || '—';
    const myAgents    = agentsBySession[p.sessionId] || [];

    // Context info from sessions list
    const sessionInfo = state.sessions.find(s => s.id === p.sessionId);
    const tok = sessionInfo?.tokens || {};
    const ctxPct    = tok.context_pct || 0;
    const ctxWindow = tok.context_window || 200000;
    const ctxUsed   = tok.ctx_used || 0;
    const cost      = sessionInfo?.cost_usd != null ? '$' + sessionInfo.cost_usd.toFixed(4) : '';
    const cls       = ctxClass(ctxPct);

    const dotClass = actStatus === 'active' ? 'active' : actStatus === 'waiting' ? 'waiting' : 'idle';

    // Tasks from teams linked to this session
    const sessionTeams = state.teams.filter(t =>
      (t.leadSessionId && t.leadSessionId === p.sessionId) ||
      (p.sessionId && t.members?.some(m => m.sessionId === p.sessionId))
    );
    const allTasks = sessionTeams.flatMap(t => t.tasks||[]);
    const tasksSummary = allTasks.length ? (() => {
      const done = allTasks.filter(t => t.status === 'completed').length;
      const inprog = allTasks.filter(t => t.status === 'in_progress').length;
      return `<div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:3px">
        ${allTasks.slice(0,6).map(t => {
          const st = t.status||'todo';
          return `<span style="font-family:var(--font-mono);font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid var(--border2);background:var(--bg1);color:${st==='completed'?'var(--green)':st==='in_progress'?'#6a9fc0':'var(--text4)'}" title="${escHtml(t.description||'')}"><span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-right:3px;vertical-align:middle"></span>${escHtml((t.subject||'task').slice(0,20))}</span>`;
        }).join('')}
        ${allTasks.length > 6 ? `<span style="font-size:9px;color:var(--text4);padding:1px 4px">+${allTasks.length-6}</span>` : ''}
      </div>`;
    })() : '';

    return `<div class="session-card ${actStatus !== 'idle' ? 'has-active' : ''}"
                 onclick="switchMainTab('session-${p.pid}')" title="Open session tab">
      <div class="sc-header">
        <span class="sc-dot ${dotClass}"></span>
        <span class="sc-name">${escHtml(sessionLabel)}</span>
        <span class="model-pill ${model}">${model}</span>
        ${p.sessionId ? `<button class="item-delete-btn session-delete-btn" data-sid="${escHtml(p.sessionId)}" title="Remove session">×</button>` : ''}
      </div>
      <div class="sc-body">
        ${ctxUsed || ctxPct ? `<div class="sc-ctx-row">
          <span class="sc-ctx-label ctx-${cls}">ctx: ${fmtK(ctxUsed)}/${fmtK(ctxWindow)} (${ctxPct}%)</span>
          <div class="ctx-bar-wrap"><div class="ctx-bar-fill ${cls}" style="width:${Math.min(100,ctxPct)}%"></div></div>
          ${cost ? `<span class="sc-cost">${cost}</span>` : ''}
        </div>` : cost ? `<div class="sc-ctx-row"><span class="sc-cost">${cost}</span></div>` : ''}
        <div class="sc-meta-row">
          <span class="sc-cwd">${escHtml(shortPath(cwd))}</span>
          <span style="font-family:var(--font-mono);font-size:9px;color:var(--text4)">pid ${p.pid}</span>
          ${myAgents.length ? `<span class="sc-agents-badge">${myAgents.length} agent${myAgents.length>1?'s':''}</span>` : ''}
        </div>
        ${act?.activity ? `<div style="margin-top:5px"><span class="status-activity"><span class="activity-dot ${actStatus}"></span>${escHtml(act.activity)}</span></div>` : ''}
        ${tasksSummary}
      </div>
    </div>`;
  }).join('');

  updateOverviewStats(data);
}

function parseCwdFromCmd(cmd) {
  if (!cmd) return null;
  const m1 = cmd.match(/--cwd[= ]([^\s]+)/);
  if (m1) return m1[1];
  const m2 = cmd.match(/-C\s+([^\s]+)/);
  if (m2) return m2[1];
  return null;
}

// ─── SESSION TABS ─────────────────────────────────────────────────────────────

function syncSessionTabs(procs, agents) {
  const tabList = document.getElementById('tab-list');

  // Remove session tab buttons that no longer have a process
  const existing = tabList.querySelectorAll('.session-tab-btn');
  const activePids = new Set(procs.map(p => p.pid));
  existing.forEach(btn => {
    const pid = parseInt(btn.dataset.pid);
    if (!activePids.has(pid)) {
      btn.remove();
      // Remove content
      const el = document.getElementById(`tab-content-session-${pid}`);
      if (el) el.remove();
      // If we were on that tab, go to overview
      if (state.activeMainTab === `session-${pid}`) {
        state.activeMainTab = 'overview';
        applyMainTab('overview');
      }
    }
  });

  // Add new session tab buttons
  const existingPids = new Set([...tabList.querySelectorAll('.session-tab-btn')].map(b => parseInt(b.dataset.pid)));
  procs.forEach((p, idx) => {
    if (!existingPids.has(p.pid)) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn session-tab-btn';
      btn.dataset.pid = p.pid;
      btn.id = `main-tab-session-${p.pid}`;
      btn.onclick = () => switchMainTab(`session-${p.pid}`);
      btn.title = `Session: ${p.sessionName || p.sessionId || p.pid}`;
      tabList.appendChild(btn);

      // Create content pane
      const pane = document.createElement('div');
      pane.className = 'tab-content';
      pane.id = `tab-content-session-${p.pid}`;
      // Insert before log strip
      const logStrip = document.querySelector('.log-strip');
      logStrip.parentNode.insertBefore(pane, logStrip);
    }
  });
}

function renderSessionTabs(data) {
  const procs  = [...(data.processes||[])].sort((a,b) => a.pid - b.pid);
  const agents = data.agents || [];

  procs.forEach((p, idx) => {
    const btn = document.getElementById(`main-tab-session-${p.pid}`);
    if (btn) {
      const act = p.sessionId ? (state.activity[p.sessionId] || null) : null;
      const isActive = act?.status === 'active';
      const label = p.sessionName || (p.sessionId ? p.sessionId.slice(0,8) : `pid-${p.pid}`);
      btn.innerHTML = `<span class="tab-dot ${isActive ? 'active-proc' : ''}"></span>${escHtml(label)}<span class="tab-kbd">${idx+1}</span>`;
    }

    const pane = document.getElementById(`tab-content-session-${p.pid}`);
    if (pane) {
      pane.innerHTML = buildSessionTabContent(p, agents);
    }
  });
}

function buildSessionTabContent(p, allAgents) {
  const model     = parseModel(p.model);
  const act       = p.sessionId ? (state.activity[p.sessionId] || null) : null;
  const actStatus = act?.status || 'idle';
  const actLabel  = act?.activity || '';
  const cwd       = parseCwdFromCmd(p.cmd) || p.cwd || '—';
  const myAgents  = (allAgents || []).filter(a => a.sessionId === p.sessionId);

  const sessionInfo = state.sessions.find(s => s.id === p.sessionId);
  const tok = sessionInfo?.tokens || {};
  const ctxPct    = tok.context_pct || 0;
  const ctxWindow = tok.context_window || 200000;
  const ctxUsed   = tok.ctx_used || 0;
  const cost      = sessionInfo?.cost_usd != null ? '$' + sessionInfo.cost_usd.toFixed(4) : '—';
  const ctxCls    = ctxClass(ctxPct);

  const vsz = p.vsz ? (p.vsz / 1e6).toFixed(1) + ' MB' : '—';
  const rss = p.rss ? (p.rss / 1024).toFixed(1) + ' MB' : '—';
  const subTab = state.activeSubTabs[p.pid] || 'agents';

  // Sub-tab content: messages
  const msgs = p.sessionId ? (state.sessionConvData[p.sessionId] || null) : null;
  let msgsHtml;
  if (!p.sessionId) {
    msgsHtml = `<div class="empty-state"><div class="empty-icon">◦</div>no session id</div>`;
  } else if (msgs === null) {
    msgsHtml = `<div style="padding:12px 14px;font-family:var(--font-mono);font-size:10px;color:var(--text3)">Loading messages…</div>`;
    // Trigger load
    loadSessionConv(p.sessionId);
  } else if (!msgs.length) {
    msgsHtml = `<div class="empty-state"><div class="empty-icon">◦</div>no messages</div>`;
  } else {
    msgsHtml = msgs.map(m => `
      <div class="msg-row">
        <div class="msg-role ${m.role||'unknown'}">${m.role||'unknown'}</div>
        <div class="msg-content">${escHtml((m.content||'').slice(0,500))}${(m.content||'').length>500?'…':''}</div>
        ${m.timestamp ? `<div class="msg-ts">${new Date(m.timestamp).toLocaleTimeString('en-US',{hour12:false})}</div>` : ''}
      </div>`).join('');
  }

  // Sub-tab content: agents
  let agentsHtml;
  if (!myAgents.length) {
    agentsHtml = `<div class="empty-state"><div class="empty-icon">◦</div>no agents</div>`;
  } else {
    // Deduplicate by id
    const seen = new Set();
    const uniqueAgents = myAgents.filter(a => { if (seen.has(a.id)) return false; seen.add(a.id); return true; });
    agentsHtml = uniqueAgents.map(a => {
      const st = (a.status||'unknown').toLowerCase();
      const expanded = state.expandedAgents.has(a.id);
      const convData = state.agentConvData[a.id];
      let convHtml = '';
      if (expanded) {
        if (state.agentConvLoading.has(a.id)) {
          convHtml = `<div class="agent-conv-area"><div style="padding:8px 14px;font-family:var(--font-mono);font-size:10px;color:var(--text3)">Loading…</div></div>`;
        } else if (!convData || !convData.length) {
          convHtml = `<div class="agent-conv-area"><div style="padding:8px 14px;font-family:var(--font-mono);font-size:10px;color:var(--text3)">No messages</div></div>`;
        } else {
          convHtml = `<div class="agent-conv-area">${convData.map(m=>`
            <div class="msg-row">
              <div class="msg-role ${m.role||'unknown'}">${m.role||'unknown'}</div>
              <div class="msg-content">${escHtml((m.content||'').slice(0,400))}${(m.content||'').length>400?'…':''}</div>
            </div>`).join('')}</div>`;
        }
      }
      return `<div class="agent-list-item" onclick="toggleAgentExpand('${escHtml(a.id)}')">
        <div class="agent-list-info">
          <div class="agent-list-id">${escHtml(shortId(a.id))}</div>
          ${a.lastLine ? `<div class="agent-list-last">${escHtml(a.lastLine)}</div>` : ''}
          <div class="agent-list-meta">
            ${a.tokens ? `<span>${fmtTokens(a.tokens.input||0)} in / ${fmtTokens(a.tokens.output||0)} out</span>` : ''}
            ${a.lastUpdate ? `<span>${escHtml(a.lastUpdate)}</span>` : ''}
          </div>
        </div>
        <span class="agent-status-badge ${st}">${st}</span>
        <button class="item-delete-btn agent-delete-btn" data-aid="${escHtml(a.id)}" title="Remove agent" style="opacity:0.5;margin-left:6px">×</button>
      </div>
      ${convHtml}`;
    }).join('');
  }

  // Teams for this session (matched by leadSessionId)
  const sessionTeams = state.teams.filter(t => t.leadSessionId === p.sessionId);
  const COLORS = ['blue','green','red','yellow','purple'];
  let teamsHtml = '';
  if (sessionTeams.length) {
    teamsHtml = sessionTeams.map(team => {
      const membersHtml = team.members.map((m, mi) => {
        const colorClass = m.isLead ? 'lead' : (m.color || COLORS[mi % COLORS.length]);
        const act2 = (m.sessionId && state.activity[m.sessionId]) || m.activity || {};
        const actHtml = act2.activity
          ? `<span class="activity-badge ${act2.status||''}"><span class="activity-dot ${act2.status||''}"></span>${escHtml(act2.activity)}</span>`
          : act2.status === 'waiting'
            ? `<span class="activity-badge waiting"><span class="activity-dot waiting"></span>Waiting…</span>`
            : '';
        const tasksHtml = (m.tasks || []).map(t2 => {
          const st2 = (t2.status||'todo');
          return `<span class="member-task-pill ${st2}" title="${escHtml(t2.description||'')}"><span class="task-status-dot ${st2}"></span>${escHtml(t2.subject||('Task #'+t2.id))}</span>`;
        }).join('');
        return `<div class="member-row">
          <span class="member-color-dot ${colorClass}"></span>
          <div class="member-info">
            <div class="member-top">
              <span class="member-name">${escHtml(m.name)}</span>
              <span class="member-role-badge ${m.isLead?'lead':''}">${m.isLead?'lead':escHtml(m.agentType||'agent')}</span>
              <span class="member-model">${parseModel(m.model||'')}</span>
            </div>
            ${actHtml ? `<div class="member-activity">${actHtml}</div>` : ''}
            ${tasksHtml ? `<div class="member-tasks">${tasksHtml}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      const allTasksHtml = (team.tasks||[]).length
        ? `<div class="team-tasks-section"><div class="team-tasks-title">Tasks (${team.tasks.length})</div>
            ${team.tasks.map(t2 => {
              const st2 = t2.status||'todo';
              return `<div class="team-task-row">
                <span class="team-task-id">#${t2.id}</span>
                <span class="team-task-subject">${escHtml(t2.subject||'')}</span>
                <span class="team-task-owner">${escHtml(t2.owner||'—')}</span>
                <span class="team-task-status ${st2}">${st2.replace('_',' ')}</span>
              </div>`;
            }).join('')}
          </div>` : '';
      return `<div class="team-card">
        <div class="team-card-header">
          <span class="team-card-name">${escHtml(team.name)}</span>
          <span class="team-card-desc">${escHtml(team.description||'')}</span>
          <button class="team-delete-btn" data-team="${escHtml(team.name)}" title="Delete team">×</button>
        </div>
        ${membersHtml}
        ${allTasksHtml}
      </div>`;
    }).join('');
  }

  // Combined agents + teams tab content
  let agentsTabHtml = '';
  if (sessionTeams.length) {
    agentsTabHtml += `<div style="padding:8px 14px 4px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text4)">Teams</div>${teamsHtml}`;
  }
  if (myAgents.length) {
    agentsTabHtml += sessionTeams.length
      ? `<div style="padding:8px 14px 4px;margin-top:4px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text4);border-top:1px solid var(--border)">Subagents</div>${agentsHtml}`
      : agentsHtml;
  }
  if (!agentsTabHtml) {
    agentsTabHtml = `<div class="empty-state"><div class="empty-icon">◦</div>no agents or teams</div>`;
  }

  const agentsCount = myAgents.length + sessionTeams.reduce((s,t) => s + t.members.length, 0);

  return `<div class="session-tab-inner">

    <!-- Process Info + Context & Cost (side by side top row) -->
    <div style="display:flex;gap:12px;flex-shrink:0;">

      <!-- Process -->
      <div class="sec-card" style="flex:1;">
        <div class="sec-header">
          <span class="sec-title">Process</span>
          <button class="kill-session-btn" onclick="openKillModal(event, ${p.pid})">Kill ${p.pid}</button>
        </div>
        <div class="sec-body">
          <div class="proc-grid">
            <span class="proc-key">PID</span><span class="proc-val">${p.pid}</span>
            <span class="proc-key">Model</span><span class="proc-val"><span class="model-pill ${model}">${model}</span></span>
            <span class="proc-key">RSS</span><span class="proc-val">${rss}</span>
            <span class="proc-key">Stat</span><span class="proc-val">${p.stat||'—'}</span>
            <span class="proc-key">Started</span><span class="proc-val">${p.started||'—'}</span>
            <span class="proc-key">Time</span><span class="proc-val">${p.time||'—'}</span>
            ${p.sessionId ? `<span class="proc-key">Session</span><span class="proc-val copyable" title="Click to copy" onclick="navigator.clipboard.writeText('${escHtml(p.sessionId)}')">${escHtml(shortId(p.sessionId))}</span>` : ''}
            <span class="proc-key">CWD</span><span class="proc-val" style="grid-column:2/-1;color:var(--text3)">${escHtml(shortPath(cwd))}</span>
          </div>
        </div>
      </div>

      <!-- Context & Cost -->
      <div class="sec-card" style="flex:1;">
        <div class="sec-header">
          <span class="sec-title">Context &amp; Cost</span>
          <span style="font-family:var(--font-mono);font-size:10px;color:var(--text2)">${cost}</span>
        </div>
        <div class="sec-body">
          ${ctxUsed || ctxPct ? `<div class="ctx-big-row">
            <span class="ctx-big-label ctx-${ctxCls}">${fmtK(ctxUsed)}/${fmtK(ctxWindow)}</span>
            <div class="ctx-big-bar-wrap"><div class="ctx-big-bar-fill ctx-bar-fill ${ctxCls}" style="width:${Math.min(100,ctxPct)}%"></div></div>
            <span class="ctx-pct ctx-${ctxCls}">${ctxPct}%</span>
          </div>` : `<div style="font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-bottom:10px">No context data</div>`}
          <div style="display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap;">
            ${tok.input ? `<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">In</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--text2)">${fmtTokens(tok.input)}</div></div>` : ''}
            ${tok.output ? `<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">Out</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--text2)">${fmtTokens(tok.output)}</div></div>` : ''}
          </div>
          <span class="status-activity">
            <span class="activity-dot ${actStatus}"></span>
            ${actLabel ? escHtml(actLabel) : actStatus === 'waiting' ? 'Waiting for input' : actStatus === 'dissolved' ? 'Dissolved' : 'Idle'}
          </span>
        </div>
      </div>
    </div>

    <!-- Agents & Teams -->
    <div class="sec-card" style="flex-shrink:0;">
      <div class="sec-header">
        <span class="sec-title">Agents${agentsCount ? ` (${agentsCount})` : ''}</span>
      </div>
      ${agentsTabHtml}
    </div>

    <!-- Messages (scrollable, fixed height) -->
    <div class="sec-card" style="flex-shrink:0;">
      <div class="sec-header">
        <span class="sec-title">Messages${msgs ? ` (${msgs.length})` : ''}</span>
        ${!msgs && p.sessionId ? `<button class="btn btn-ghost" style="padding:2px 8px;font-size:9px" onclick="loadSessionConv('${escHtml(p.sessionId)}')">Load</button>` : ''}
      </div>
      <div style="max-height:280px;overflow-y:auto;">
        <div class="msg-list">${msgsHtml}</div>
      </div>
    </div>

  </div>`;
}

function switchSubTab(pid, tab) {
  state.activeSubTabs[pid] = tab;
  if (state.data) rerenderSessionTabByPid(pid);
  const p = (state.data?.processes||[]).find(pr => pr.pid === pid);
  if (!p) return;
  if (tab === 'messages' && p.sessionId) loadSessionConv(p.sessionId);
}

function rerenderSessionTabByPid(pid) {
  const pane = document.getElementById(`tab-content-session-${pid}`);
  if (!pane || !state.data) return;
  const p = (state.data.processes||[]).find(pr => pr.pid === pid);
  if (!p) return;
  pane.innerHTML = buildSessionTabContent(p, state.data.agents||[]);
}

function toggleAgentExpand(id) {
  if (state.expandedAgents.has(id)) {
    state.expandedAgents.delete(id);
  } else {
    state.expandedAgents.add(id);
    loadAgentConv(id);
  }
  if (state.data) {
    const agent = (state.data.agents||[]).find(a => a.id === id);
    if (agent) {
      const p = (state.data.processes||[]).find(pr => pr.sessionId === agent.sessionId);
      if (p) rerenderSessionTabByPid(p.pid);
    }
  }
}

// ─── TAB SWITCHING ────────────────────────────────────────────────────────────

function switchMainTab(tab) {
  state.activeMainTab = tab;
  applyMainTab(tab);

  // Preload data when switching to a session tab
  if (tab.startsWith('session-')) {
    const pid = parseInt(tab.replace('session-', ''));
    const p = (state.data?.processes||[]).find(pr => pr.pid === pid);
    if (p?.sessionId) loadSessionConv(p.sessionId);
  }
}

function applyMainTab(tab) {
  // Deactivate all content panes and tab buttons
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

  // Activate target
  const contentEl = document.getElementById(`tab-content-${tab}`);
  if (contentEl) contentEl.classList.add('active');
  const btnEl = document.getElementById(`main-tab-${tab}`);
  if (btnEl) btnEl.classList.add('active');
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  // Ignore if inside an input/textarea
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'Escape' || e.key === '`') {
    switchMainTab('overview');
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    const procs = [...(state.data?.processes||[])].sort((a,b)=>(a.first_seen||a.pid)-(b.first_seen||b.pid));
    // Tabs cycle: overview → session1 → session2 → … → overview
    const tabs = ['overview', ...procs.map(p => `session-${p.pid}`)];
    const cur  = state.activeMainTab;
    const idx  = tabs.indexOf(cur);
    const next = tabs[(idx + 1) % tabs.length];
    switchMainTab(next);
    return;
  }

  const digit = parseInt(e.key);
  if (digit >= 1 && digit <= 9) {
    const procs = [...(state.data?.processes||[])].sort((a,b)=>a.pid-b.pid);
    const target = procs[digit-1];
    if (target) switchMainTab(`session-${target.pid}`);
  }
});

// ─── KILL MODAL ───────────────────────────────────────────────────────────────

function openKillModal(e, pid) {
  e.stopPropagation();
  state.killTarget = pid;
  document.getElementById('modal-pid').textContent = pid;
  document.getElementById('kill-modal').classList.add('open');
}

document.getElementById('modal-cancel').addEventListener('click', () => {
  document.getElementById('kill-modal').classList.remove('open');
  state.killTarget = null;
});

document.getElementById('kill-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('kill-modal')) {
    document.getElementById('kill-modal').classList.remove('open');
    state.killTarget = null;
  }
});

document.getElementById('modal-confirm').addEventListener('click', async () => {
  const pid = state.killTarget;
  if (!pid) return;
  document.getElementById('kill-modal').classList.remove('open');
  try {
    await fetch(`http://localhost:7337/kill?pid=${pid}`, { method: 'GET' });
    addLog(`Sent kill to PID ${pid}`);
    setTimeout(fetchData, 800);
  } catch (err) {
    addLog(`Kill failed: ${err.message}`);
  }
  state.killTarget = null;
});

// ─── LOG STRIP ────────────────────────────────────────────────────────────────

document.getElementById('log-toggle').addEventListener('click', () => {
  state.logOpen = !state.logOpen;
  document.getElementById('log-full').classList.toggle('open', state.logOpen);
  document.getElementById('log-chevron').classList.toggle('open', state.logOpen);
});

function renderLog() {
  const preview = state.logs[0]?.msg || 'Waiting for data…';
  document.getElementById('log-preview').textContent = preview;
  document.getElementById('log-full').innerHTML = state.logs.map(e =>
    `<div class="log-entry"><span class="log-time">${e.time}</span><span class="log-msg">${escHtml(e.msg)}</span></div>`
  ).join('');
}

// ─── POLLING ──────────────────────────────────────────────────────────────────

let _dataTimer = null;
function scheduleDataPoll() {
  clearTimeout(_dataTimer);
  const hasRunning = (state.data?.processes||[]).length > 0 || (state.data?.agents||[]).some(a => a.status === 'running');
  const delay = hasRunning ? 3000 : 6000;
  _dataTimer = setTimeout(async () => { await fetchData(); scheduleDataPoll(); }, delay);
}

fetchData().then(scheduleDataPoll);
</script>
</body>
</html>
